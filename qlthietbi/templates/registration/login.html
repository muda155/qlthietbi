{% extends "qlthietbi/base.html" %}

{% block title %}Đăng nhập - Sổ Kỹ Thuật Số{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-lg">
            <div class="card-header text-center py-4">
                <h2 class="h4 mb-0">
                    <i class="fas fa-ship me-2 text-primary"></i>Sổ Kỹ Thuật Số
                </h2>
                <small class="text-muted">Hệ thống quản lý kỹ thuật tàu</small>
            </div>
            <div class="card-body p-4">
                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>Tên đăng nhập hoặc mật khẩu không đúng.
                    </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" name="username" class="form-control" autofocus required id="id_username" placeholder="Nhập tên tài khoản">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" name="password" class="form-control" required id="id_password" placeholder="Nhập mật khẩu">
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                <small class="text-muted">Phiên bản 1.0.0 (Secure)</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
